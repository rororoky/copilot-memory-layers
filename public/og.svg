<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#16233a" />
      <stop offset="70%" stop-color="#070a0f" />
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="33%" stop-color="#2dd4bf" />
      <stop offset="66%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#glow)" />
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)" />

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="64" y="62" width="330" height="34" rx="17" fill="#6ea8fe" fill-opacity="0.14" />
    <text x="84" y="85" font-size="15" font-weight="700" letter-spacing="1.6" fill="#6ea8fe">UNOFFICIAL · SOURCE-BACKED</text>

    <text x="64" y="200" font-size="46" font-weight="700" fill="#e9eff7">Copilot remembers things.</text>
    <text x="64" y="262" font-size="46" font-weight="700" fill="#e9eff7">Here is exactly what,</text>
    <text x="64" y="324" font-size="46" font-weight="700" fill="#e9eff7">where, and for how long.</text>

    <text x="66" y="392" font-size="26" fill="#a3b1c2">Six layers. Three scopes. One lifecycle.</text>

    <rect x="64" y="446" width="250" height="2" fill="#2a3b4f" />
    <text x="64" y="500" font-size="20" fill="#6d7f93">An interactive, source-backed guide</text>
    <text x="64" y="532" font-size="20" fill="#6d7f93">No tracking · No network calls</text>

    <g transform="translate(740 92)">
      <rect x="0" y="0" width="404" height="446" rx="22" fill="#0d131c" stroke="#1c2836" />
      <text x="28" y="46" font-size="18" font-weight="700" fill="#e9eff7">The six layers</text>
      <text x="28" y="72" font-size="14" fill="#6d7f93">Where Copilot's knowledge can live</text>

      <g font-size="16">
        <rect x="28" y="100" width="348" height="44" rx="9" fill="#a78bfa" fill-opacity="0.14" />
        <rect x="28" y="100" width="6" height="44" rx="3" fill="#a78bfa" />
        <text x="48" y="128" fill="#a78bfa" font-weight="700">0</text>
        <text x="76" y="128" fill="#e9eff7">Model weights</text>
        <text x="356" y="128" fill="#6d7f93" font-size="13" text-anchor="end">permanent</text>

        <rect x="28" y="154" width="348" height="44" rx="9" fill="#2dd4bf" fill-opacity="0.12" />
        <rect x="28" y="154" width="6" height="44" rx="3" fill="#2dd4bf" />
        <text x="48" y="182" fill="#2dd4bf" font-weight="700">1</text>
        <text x="76" y="182" fill="#e9eff7">Working memory</text>
        <text x="356" y="182" fill="#6d7f93" font-size="13" text-anchor="end">one chat</text>

        <rect x="28" y="208" width="348" height="44" rx="9" fill="#fbbf24" fill-opacity="0.12" />
        <rect x="28" y="208" width="6" height="44" rx="3" fill="#fbbf24" />
        <text x="48" y="236" fill="#fbbf24" font-weight="700">2</text>
        <text x="76" y="236" fill="#e9eff7">Session memory</text>
        <text x="356" y="236" fill="#6d7f93" font-size="13" text-anchor="end">one chat</text>

        <rect x="28" y="262" width="348" height="44" rx="9" fill="#60a5fa" fill-opacity="0.12" />
        <rect x="28" y="262" width="6" height="44" rx="3" fill="#60a5fa" />
        <text x="48" y="290" fill="#60a5fa" font-weight="700">3</text>
        <text x="76" y="290" fill="#e9eff7">Repository memory</text>
        <text x="356" y="290" fill="#6d7f93" font-size="13" text-anchor="end">persists</text>

        <rect x="28" y="316" width="348" height="44" rx="9" fill="#f472b6" fill-opacity="0.12" />
        <rect x="28" y="316" width="6" height="44" rx="3" fill="#f472b6" />
        <text x="48" y="344" fill="#f472b6" font-weight="700">4</text>
        <text x="76" y="344" fill="#e9eff7">User memory</text>
        <text x="356" y="344" fill="#6d7f93" font-size="13" text-anchor="end">persists</text>

        <rect x="28" y="370" width="348" height="44" rx="9" fill="#a3e635" fill-opacity="0.12" />
        <rect x="28" y="370" width="6" height="44" rx="3" fill="#a3e635" />
        <text x="48" y="398" fill="#a3e635" font-weight="700">5</text>
        <text x="76" y="398" fill="#e9eff7">Source-controlled</text>
        <text x="356" y="398" fill="#6d7f93" font-size="13" text-anchor="end">versioned</text>
      </g>
    </g>
  </g>
</svg>
