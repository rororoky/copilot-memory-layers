name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # Phase 1 smoke build. Production still deploys the legacy `dist/` output
      # below; this proves Astro, the base path, and the 404 route build in CI.
      - name: Verify Astro scaffold
        run: npm run verify:astro
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: https://${{ github.repository_owner }}.github.io

      - name: Upload Astro smoke build
        uses: actions/upload-artifact@v4
        with:
          name: astro-smoke
          path: dist-astro
          retention-days: 7

      - name: Build
        run: npm run build
        env:
          # "/" for user and organisation sites, "/<repo>/" for project sites.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      - name: Check internal links
        run: npm run check:links
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
