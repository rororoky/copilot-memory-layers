name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Exercise both a user/organisation site and a project site.
        base: ['/', '/copilot-memory-layers']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify build
        run: npm run verify
        env:
          BASE_PATH: ${{ matrix.base }}
          SITE_URL: https://example.github.io
